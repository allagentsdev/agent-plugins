# Stable case IDs; v2 replaces private source material with fictional fixtures.
- description: '[D2] fictional restart design preserves execution and delivery boundaries'
  vars:
    surface: Detailed build design
    request: Rewrite these design sections in a direct, evidence-led style so a colleague can understand the system
      on the first read. Preserve the design and its constraints. Return only the rewritten sections.
    draft: |
      ## Purpose

      A fictional job service is replacing Temporal with a PostgreSQL runtime owned by the application. The existing single model step and absence of tools stay the same; see [the demo baseline](https://example.org/demo/baseline).

      1. Router validates the request and saves one job plus a pending `Processing` update.
      2. Worker replicas poll PostgreSQL, then run complete jobs in memory.
      3. PostgreSQL prevents duplicate jobs, tracks leases and enforces a cluster-wide model capacity limit.
      4. A transaction commits the result and the first outgoing Message Service delivery.
      5. Workers use a separate loop to send stored responses and status updates, retrying failed deliveries.
      6. A crash before that commit restarts the whole job; a crash after it retries delivery only.

      In this demo, Temporal lacks production approval. There are no customers or production jobs to migrate. Remove it directly and discard development state.

      ## Design decisions

      PostgreSQL owns jobs, lease ownership, attempt history, capacity, committed outcomes and pending deliveries. No Redis, Kafka or replacement orchestrator is added.

      The complete job is the durable execution boundary. Model and tool progress remains in Worker memory. A failed attempt before result commit starts again from the stored input, with no model, tool or job-step checkpoints.

      Each claim or restart increments a generation and assigns a new random token. Only that lease owner can commit. An older Worker may still compute, but cannot renew, commit or release capacity.

      A running job owns one fixed PostgreSQL capacity row. Replica count, database pool size and process-local semaphores do not enforce correctness. Message Service must confirm `Processing` before a job claims capacity.

      One transaction saves the result or a sanitized error code and message, releases capacity and queues the next delivery. Delivery retries use the stored bytes and original idempotency key, without invoking the model again.

      Router publishes work. Workers poll; PostgreSQL does not push it, and the initial build uses no `LISTEN`/`NOTIFY`.

      Use raw Npgsql and explicit transactions. The persistence component owns parameterized SQL, role-specific connections, transaction boundaries and recovery from a lost database acknowledgement. Add no ORM or workflow abstraction. The cutover needs no compatibility layer, dual write, state conversion or rollback path.
    pass_criterion: |
      The opening explains the replacement, Router and Worker responsibilities, and unchanged one-step/no-tool behavior before detailed invariants. It does not invent missing current-system behavior.
      Mechanisms are explained in complete actor-and-action sentences, with each condition beside its consequence. In particular, the reader can understand pre-commit restart, post-commit delivery-only recovery, and rejection of an older Worker's writes without having to assemble fragments from separate lists.
      Structure supports the explanation: ordered steps for flow, paragraphs for causal reasoning, and headings or lists where they aid navigation. Each rule has one main explanation; any repetition serves orientation or verification rather than recapping the whole design.
      Preserve complete-job restart from stored input, no intermediate checkpoints, a higher generation and new random token on every claim/restart, and the fact that an older Worker may still compute but cannot renew, commit or release capacity.
      Preserve prevention of duplicate jobs, not merely prevention of duplicate claims on a job. Preserve PostgreSQL capacity-slot enforcement, Processing confirmation before claiming capacity, atomic result/error storage plus capacity release plus the next delivery, and stored-byte/same-key retries without model execution. Keep raw Npgsql with no ORM and the stated migration and scope exclusions.
      Judge readability and fidelity, not word count, exact wording, a mandatory section template or agreement with a different architecture.
    fails_if: |
      Merely shortens or relabels the original decision list while leaving the reader to interpret unexplained abstractions such as durable boundary; turns the explanation into terse fragments or a dense matrix; or repeats the same rules across several summary sections without adding information.
      Changes duplicate-job prevention into duplicate-claim prevention; changes pre-commit failure into a terminal error with no restart; imports EF Core or another terminal-failure design technical choice; claims the older Worker has stopped; promises exactly-once model execution; allows execution before Processing confirmation; retries the model after a committed result; or drops any supplied constraint, uncertainty or factual claim.
  metadata:
    id: D2
    group: regression
    surface: technical-design
    dataset_version: v2-public-fictional
    fixture_origin: Original fictional fixture; no captured review text or private provenance.
- description: '[D3] fictional terminal-failure design preserves explanatory flow'
  vars:
    surface: Detailed build design
    request: Rewrite these design sections in a direct, evidence-led style so a colleague can understand the system
      on the first read. Preserve the design and its constraints. Return only the rewritten sections.
    draft: |
      ## Purpose

      A second fictional job service uses Temporal to pass a prepared request from Router to Worker and prevent duplicate starts for the same message. Replace that handoff with a PostgreSQL queue. Router still prepares requests and Worker still runs jobs in memory. The database keeps input while queued or executing and output while Message Service delivery is pending. It stores no individual model or tool steps.

      ## Main flow

      1. Router receives and validates a Message Service message.
      2. Router resolves the job contract and skills before storing a run.
      3. A unique key prevents duplicate rows for the same recipient and message ID.
      4. Worker polls when it has capacity.
      5. Worker claims one row and commits the claim before execution.
      6. Worker runs the whole job without retaining a database connection or transaction.
      7. Worker stores delivery details before calling Message Service.
      8. Successful delivery removes the request and response bodies from the row.

      Use Entity Framework Core with Npgsql for tables, mappings, migrations and normal updates. The claim uses parameterized PostgreSQL `FOR UPDATE SKIP LOCKED` inside an EF transaction.

      ## Queue states

      These states are separate from Message Service statuses `Received`, `Processing`, `Processed`, `Delivered` and `Failed`.

      | State | Meaning |
      | --- | --- |
      | `queued` | The complete input is ready for a Worker. |
      | `executing` | One Worker has claimed the run and is executing it. |
      | `sending` | Execution has ended and stored delivery awaits Message Service. |
      | `done` | Successful Message Service calls have completed. |
      | `error` | Execution or delivery has failed and automatic work has ended. |

      Only `queued` rows may start execution. The claim atomically changes a row to `executing`, preventing two Workers from claiming it.

      During execution, perform no periodic database updates. The claim records an execution token, owner, start time and deadline. That deadline drives cancellation. Saving the outcome checks state, token and deadline so an older Worker cannot replace a later error.

      A Worker crash during execution never restarts the job. After the contract deadline and a short grace period, cleanup stores a safe failure and changes the row to `sending`. The send path attempts to mark the Message Service message `Failed`; the row never returns to `queued`.

      Sending uses a separate short-lived token. Before calling Message Service, store exact response bytes, the target status and idempotence keys. Another Worker can retry this stored delivery after a crash, without executing the job again. Stop after the configured delivery-attempt limit, record `error` and alert.
    pass_criterion: |
      Retain the preferred sample's explanatory style: orient the reader with today's Temporal behavior, the PostgreSQL replacement and unchanged responsibilities; explain the main flow before the failure rules; and use complete sentences with named actors and concrete verbs.
      Keep causal reasoning in short paragraphs, particularly Worker death followed by deadline/grace-period cleanup and the attempted Failed update. Use a sequence for ordered operations and a compact comparison for state meanings; equivalent readable organization is acceptable.
      Preserve all five queue states and their meanings, their distinction from Message Service statuses, the atomic queued-to-executing claim, execution token/owner/start/deadline, deadline-driven cancellation, and state/token/deadline checks when saving results. No periodic database updates are added during execution.
      A Worker crash during execution must not restart the agent: cleanup waits for the contract deadline and short grace period, stores a safe failure in sending, and the send path attempts to mark Message Service Failed. The row never returns to queued.
      A crash after storing delivery may retry only the exact stored delivery, using a separate short-lived token, original response bytes, target Message Service status and idempotence keys. Preserve the configured attempt limit, terminal error and alert, completed-body removal, and EF Core/Npgsql with the explicit SQL claim inside an EF transaction.
      Already-readable prose may remain unchanged. Judge understanding and fidelity, not how much the text changed or how short it became.
    fails_if: |
      Replaces concrete explanations with unexplained labels, slogan-like design decisions or sentence fragments; scatters a failure and its consequence across unrelated sections; flattens the whole design into a dense checklist; or removes useful state/flow navigation merely to save words.
      Imports restart design's complete-job restart, renewable execution leases, cluster-wide capacity-slot rows or no-ORM rule; conflates queue states with Message Service statuses; claims that marking Failed is guaranteed rather than attempted; reruns execution during delivery recovery; retains completed request/response bodies; or drops any supplied constraint or factual claim.
