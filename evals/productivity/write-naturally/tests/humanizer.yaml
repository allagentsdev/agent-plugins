# Humanizer-inspired behavioral cases and controls, authored as fictional examples.
# Calibration examples are metadata only; neither writer prompt receives them.
- description: '[H1] announcement states the feature without staged contrasts'
  vars:
    surface: Product announcement
    request: Rewrite this as a short, natural announcement.
    context: The supported facts are the launch of CalendarBird and email reminders one day before appointments.
      The draft contains rhetorical framing; no broader customer outcome has been measured.
    draft: 'CalendarBird is not just a calendar. It is a bridge to meaningful connections. Here is what you need
      to know: CalendarBird is now available and emails a reminder one day before each appointment. This changes
      everything.'
    pass_criterion: States that CalendarBird is available and emails reminders one day before appointments. Makes
      no unsupported outcome claim.
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: States the feature directly without inventing an opposing belief, announcing an explanation,
      or adding a dramatic closing that repeats or inflates the point.
    style_fails_if: Keeps staged framing, an unprompted not-X-but-Y contrast, or a closer that adds no concrete
      information.
  metadata:
    id: H1
    dataset_version: v1-public-fictional
    group: humanizer
    surface: Product announcement
    fixture_origin: Original fictional fixture; no captured personal writing or private provenance.
    pattern_source: https://github.com/blader/humanizer/blob/225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8/SKILL.md
    pattern_sections:
    - 1
    - 2
    - 4
    - 5
    calibration_good: CalendarBird is available now. It emails you a reminder one day before each appointment.
    calibration_bad_style: This is not just a calendar update. CalendarBird is now available and emails a reminder
      one day before each appointment. That is the real win.
    calibration_origin: Manually authored controls for grader calibration; never supplied to the writer or used
      for exact matching.
- description: '[H2] measured result keeps its scope without dramatic fragments'
  vars:
    surface: Team update
    request: Rewrite this pilot update naturally and keep the measurement precise.
    context: Only one pilot team was measured. No organization-wide improvement has been established.
    draft: The pilot team spent two hours preparing the report, down from three. Read that again. One hour back.
      No wasted motion. No endless busywork. This is a pivotal moment for productivity.
    pass_criterion: Preserves report preparation falling from three hours to two for the one pilot team. Does not
      generalize beyond the pilot or invent another measurement.
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: Lets the measured change carry the point, using connected conversational sentences rather than
      theatrical fragments or claims of significance.
    style_fails_if: Retains dramatic pauses, repeated fragments, or an inflated lesson after the measurement.
  metadata:
    id: H2
    dataset_version: v1-public-fictional
    group: humanizer
    surface: Team update
    fixture_origin: Original fictional fixture; no captured personal writing or private provenance.
    pattern_source: https://github.com/blader/humanizer/blob/225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8/SKILL.md
    pattern_sections:
    - 2
    - 3
    - 13
    calibration_good: The pilot team prepared the report in two hours, down from three.
    calibration_bad_style: The pilot team prepared the report in two hours, down from three. Read that again. One
      hour saved. That is the real win.
    calibration_origin: Manually authored controls for grader calibration; never supplied to the writer or used
      for exact matching.
- description: '[H3] marketing copy uses supported functionality instead of vague authority'
  vars:
    surface: Product description
    request: Rewrite this as plain product copy using only the confirmed features.
    context: 'Confirmed features: filter tickets by owner and status, and save that view. No expert endorsement,
      customer study or performance benchmark is supplied.'
    draft: Experts agree that QueueLeaf is a groundbreaking solution in the evolving landscape of team productivity.
      It lets you filter tickets by owner and status and save the view, underscoring its profound impact on how
      teams work.
    pass_criterion: Preserves filtering tickets by owner and status and saving the view. Adds no expert endorsement,
      study, benchmark or other unsupported benefit.
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: Uses concrete functionality and ordinary verbs. Makes the product understandable without vague
      authority or inflated significance.
    style_fails_if: Leaves promotional scaffolding around the supported features, or substitutes abstract praise
      for an explanation of what the product does.
  metadata:
    id: H3
    dataset_version: v1-public-fictional
    group: humanizer
    surface: Product description
    fixture_origin: Original fictional fixture; no captured personal writing or private provenance.
    pattern_source: https://github.com/blader/humanizer/blob/225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8/SKILL.md
