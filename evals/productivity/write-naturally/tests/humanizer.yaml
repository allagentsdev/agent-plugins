- description: '[H6] reply respects the context the recipient already knows'
  vars:
    surface: Planning thread reply
    request: Write a short reply stating the decision and next action.
    context: The recipient already knows the room has 12 practice stations and agrees that attendance must be capped
      at 12. The current decision is to keep the cap for this workshop and put extra registrants on a waiting list
      for next month.
    draft: The room contains 12 practice stations. That is why the workshop can take only 12 attendees, as we discussed.
      If we admit more people, some will not have a station. Since we have already agreed to this limit, I think
      we should keep it for this workshop and put extra registrants on the waiting list for next month.
    pass_criterion: States the settled decision to keep the 12-person cap for this workshop and place extra registrants
      on the waiting list for next month.
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: Leads with the decision and action, using only context that the recipient still needs. The
      reply need not re-explain the known room constraint.
    style_fails_if: Rebuilds the explanation already agreed in the thread before reaching the decision, or narrates
      the drafting process.
  metadata:
    id: H6
    dataset_version: v1-public-fictional
    group: humanizer
    surface: Planning thread reply
    fixture_origin: Original fictional fixture; no captured personal writing or private provenance.
    pattern_source: https://github.com/blader/humanizer/blob/225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8/SKILL.md
    pattern_sections:
    - 26
    calibration_good: Keep the cap at 12 for this workshop and put extra registrants on the waiting list for next
      month.
    calibration_bad_style: As we discussed, the room has 12 practice stations, so some attendees would lack a station
      if we admitted more than 12. For that reason, keep the 12-person cap for this workshop and put extra registrants
      on the waiting list for next month.
    calibration_origin: Manually authored controls for grader calibration; never supplied to the writer or used
      for exact matching.
- description: '[H7] three genuine requirements keep useful navigation'
  vars:
    surface: Handoff checklist
    request: Polish this checklist lightly and retain the three bullets so staff can check them off.
    context: All three tasks are required and distinct. The checklist format is part of the request.
    draft: |-
      - Confirm the room booking by Tuesday.
      - Send the attendee list by Wednesday.
      - Return the access cards on Friday.
    pass_criterion: 'Keeps each task and its deadline: room confirmation Tuesday, attendee list Wednesday, access-card
      return Friday.'
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: Preserves useful checklist structure and three genuinely distinct items. Already-natural wording
      may stay unchanged.
    style_fails_if: Removes useful bullets or merges distinct tasks merely to avoid a list of three; adds decorative
      headings or a generic conclusion.
