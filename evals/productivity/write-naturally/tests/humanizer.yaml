- description: '[H4] short delivery message uses a proportionate format'
  vars:
    surface: Customer chat
    request: Rewrite this as a brief, friendly chat message.
    context: The order shipped Monday, is due Thursday, and can be tracked at the supplied link.
    draft: |-
      **Shipment Update:** Your order shipped Monday.
      **Arrival Insight:** It is due Thursday.
      **Tracking Convenience:** You can track it at https://example.org/tracking/parcel-27.
      A seamless delivery experience awaits.
    pass_criterion: Keeps Monday shipment, Thursday expected arrival, and the exact tracking URL. Does not turn
      the expected arrival into a guarantee.
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: Uses an ordinary short chat message with formatting proportionate to the three simple facts.
    style_fails_if: Formats the chat as a decorated announcement with a label for every sentence, or adds a promotional
      closing.
  metadata:
    id: H4
    dataset_version: v1-public-fictional
    group: humanizer
    surface: Customer chat
    fixture_origin: Original fictional fixture; no captured personal writing or private provenance.
    pattern_source: https://github.com/blader/humanizer/blob/225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8/SKILL.md
