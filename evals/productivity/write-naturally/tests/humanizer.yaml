- description: '[H8] plain technical wording survives shape edits'
  vars:
    surface: Release note
    request: Polish this release note naturally without weakening the behavior.
    context: Gate is the established technical term in this system. The guarantees are part of the release note,
      not decorative detail.
    draft: The deployment gate checks the signature before publishing. If the signature is invalid, it publishes
      nothing. The export starts all report jobs before waiting and returns the results in the original request
      order.
    pass_criterion: Preserves the signature check before publishing, publishing nothing on an invalid signature,
      starting all report jobs before waiting, and returning results in original request order.
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: Keeps plain technical wording and sufficient explanation. Already-readable sentences may remain
      unchanged; established technical terms are appropriate.
    style_fails_if: Replaces the clear mechanisms with slogans, makes the note grandiose, or unnecessarily paraphrases
      an established technical term as if it were forbidden.
  metadata:
    id: H8
    dataset_version: v1-public-fictional
    group: humanizer
    surface: Release note
    fixture_origin: Original fictional fixture; no captured personal writing or private provenance.
    pattern_source: https://github.com/blader/humanizer/blob/225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8/SKILL.md
    pattern_sections:
    - 12
    - How to work
    - When not to act
    calibration_good: The deployment gate checks the signature before publishing and publishes nothing if it is
      invalid. The export starts all report jobs before waiting, then returns results in the original request order.
    calibration_bad_style: The deployment gate checks the signature before publishing and publishes nothing if it
      is invalid. The export starts all report jobs before waiting and returns results in the original request order.
      This is not just a release; it is a turning point for reliability.
    calibration_origin: Manually authored controls for grader calibration; never supplied to the writer or used
