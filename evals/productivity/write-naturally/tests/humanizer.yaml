- description: '[H5] already-natural X post keeps the author voice'
  vars:
    surface: X post
    request: Polish this lightly, keeping the dry humor and first-person voice.
    context: This is a fictional authored post. Its anecdote and opinion are supplied, so they may be retained.
      No customer adoption or performance claims are supplied.
    draft: Spent the morning automating a task that takes two minutes. Excellent use of four hours. Anyway, the
      script is here and future me owes me a coffee.
    pass_criterion: Keeps the two-minute task, four hours spent, available script, and first-person coffee joke.
      Does not invent adoption, performance results or personal experiences.
    fails_if: Changes or omits a required fact, adds an unsupported claim, or changes the requested intent.
    style_criterion: Keeps the casual dry humor and recognisable first-person voice. An already-readable draft may
      remain unchanged or receive only small edits.
    style_fails_if: Turns it into a formal status report, adds a generic moral or promotional claim, or removes
      the supplied humor just to make it sound neutral.
  metadata:
    id: H5
    dataset_version: v1-public-fictional
    group: humanizer
    surface: X post
    fixture_origin: Original fictional fixture; no captured personal writing or private provenance.
    pattern_source: https://github.com/blader/humanizer/blob/225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8/SKILL.md
