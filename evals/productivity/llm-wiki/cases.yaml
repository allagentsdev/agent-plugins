- description: Create a page when related mechanisms answer different questions
  vars:
    scenario: |
      Domain: native plant nursery operations.
      Schema: A new concept page needs two independent sources. Search the listed
      concept pages by title and scope before proposing any new page.
      Existing concept: pot-drainage covers how holes and pot shape allow excess
      water to leave a container.
      N1, from an irrigation cooperative: Capillary Mat Irrigation uses a damp
      fabric under pots as a shared reservoir. Water rises into the mix through
      the pot holes and the operator refills the reservoir instead of each pot.
      N2, from a nursery trial: Bottom-watering on a capillary mat reduced
      watering rounds. Set pots directly on the mat to maintain contact and
      remove dry gaps that interrupt uptake.
    expected:
      - action: new-page
        page: capillary-mat-irrigation
        evidence: [N1, N2]

- description: Extend an existing page when a new example answers the same question
  vars:
    scenario: |
      Domain: community lantern workshops.
      Schema: Create a concept page for a distinct question backed by at least two
      independent sources. Merge terminology variants into the existing page.
      Existing concept: diffused-lighting covers scattering a point light through
      translucent materials to soften sharp shadows. It documents wax paper.
      L1, from a teaching studio: A translucent cloth sleeve scatters an exposed
      LED and softens its hard shadow. Two cloth layers produce a softer shadow.
      L2, from an independent makerspace: Swapping a clear lantern wall for a
      thin cloth sleeve softened the shadows in our bench test.
    expected:
      - action: extend-page
        page: diffused-lighting
        evidence: [L1, L2]

- description: Repeated posts from one author cannot meet an independence threshold
  vars:
    scenario: |
      Domain: community ceramics studio operations.
      Schema: Require two independent sources for a new concept page. Retain
      otherwise useful ideas from incomplete evidence in source notes.
      Existing concept: tool-storage covers finding, returning and storing tools
      in labelled drawers.
      S1, a post by the Kiln Lane studio manager: We use a Shadow Board Audit.
      Missing outlines on the wall expose gaps at closing so staff can follow up.
      S2, the same manager's follow-up: Photographs from the same trial show the
      closing checklist has one line for inspecting the Shadow Board Audit.
    expected:
      - action: source-note
        page: null
        evidence: [S1, S2]

- description: Respect a schema that permits one central source
  vars:
    scenario: |
      Domain: bicycle repair clinics.
      Schema: Create a page if a technique answers a distinct question and is the
      central subject of one detailed source. Record source attribution and
      confidence for single-source material.
      Existing concept: tyre-puncture-inspection covers locating debris and
      visible holes in an unmounted tyre.
      B1, a detailed clinic handout devoted to Bead Seating Inspection: Before
      final inflation, follow the moulded line around both sides of the installed
      tyre. If the line disappears at one point, let air out and reseat the bead
      there. Recheck both sides before bringing the tyre to operating pressure.
    expected:
      - action: new-page
        page: bead-seating-inspection
        evidence: [B1]

- description: Find a page-worthy gap in a batch dominated by existing material
  vars:
    scenario: |
      Domain: community archive intake.
      Schema: Require two independent sources for a new concept page. Keep
      illustrations in the source record if they add no guidance.
      Existing concept: accession-labels explains when to apply the intake
      identifier and where to record it. It already covers paper tags.
      A1, from the city archive: Add a removable barcode to the sleeve during
      intake. Volunteers can scan it to record the existing accession identifier.
      A2, from a historical society: Show the barcode next to the handwritten
      identifier so intake staff can verify the scan.
      A3, from the city archive: Our intake photographs include an accession
      label on a paper tag. The image illustrates the current labelling guide.
      A4, from the city archive: A Quarantine Shelf separates incoming materials
      with signs of mould until they can be inspected. Assign the item a location
      record before putting it on the shelf.
      A5, from a university archive: Our quarantine shelf isolates suspect
      donations from inspected collections. Release a donation only after the
      conservator signs inspection clearance.
    expected:
      - action: extend-page
        page: accession-labels
        evidence: [A1, A2]
      - action: source-note
        page: null
        evidence: [A3]
      - action: new-page
        page: quarantine-shelf
        evidence: [A4, A5]
